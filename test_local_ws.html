<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Local WebSocket Audio Test</title>
  <style>
    body { font-family: sans-serif; max-width: 560px; margin: 40px auto; }
    input { width: 100%; padding: 8px; margin-bottom: 8px; box-sizing: border-box; }
    button { padding: 8px 16px; margin-right: 8px; }
    #status { margin: 8px 0; font-size: 13px; color: #555; }
    #transcript { margin-top: 16px; border: 1px solid #ddd; border-radius: 6px; padding: 12px; min-height: 200px; overflow-y: auto; }
    .turn { margin-bottom: 10px; }
    .turn .speaker { font-weight: bold; }
    .turn .conf { color: #999; font-size: 11px; margin-left: 6px; }
  </style>
</head>
<body>
  <h2>Local WebSocket Audio Stream Test</h2>
  <p>Test connection to <code>ws://localhost:8000/ws/audio/</code> (new session).</p>
  <button onclick="connect()">Connect</button>
  <button onclick="startMic()" id="startBtn" disabled>Start Mic</button>
  <button onclick="stopMic()" id="stopBtn" disabled>Stop Mic</button>
  <button onclick="endSession()" id="endBtn" disabled>End Session</button>
  <div id="status">Not connected.</div>
  <div id="transcript"></div>

  <script>
    let ws, audioCtx, sourceNode, processorNode, mediaStream;
    let sessionId = null;
    const TARGET_SAMPLE_RATE = 16000;

    const statusEl = document.getElementById('status');
    const transcriptEl = document.getElementById('transcript');
    const setStatus = (msg) => { statusEl.textContent = msg; };

    function connect() {
      ws = new WebSocket('ws://localhost:8000/ws/audio/');
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        setStatus('Connected. Waiting for session_started...');
        document.getElementById('startBtn').disabled = false;
        document.getElementById('endBtn').disabled = false;
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        console.log('Received:', data);
        if (data.type === 'session_started') {
          sessionId = data.session_id;
          setStatus(`Session: ${sessionId}`);
        } else if (data.type === 'final') {
          renderFinal(data);
        } else if (data.type === 'session_ended') {
          setStatus(`Session ${sessionId} ended.`);
        }
      };

      ws.onerror = (e) => {
        console.error('WebSocket error:', e);
        setStatus('Error — see console.');
      };
      ws.onclose = () => {
        setStatus('Disconnected.');
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('endBtn').disabled = true;
      };
    }

    function renderFinal(data) {
      const div = document.createElement('div');
      div.className = 'turn';
      const conf = data.confidence !== null && data.confidence !== undefined
        ? data.confidence.toFixed(2) : 'n/a';
      div.innerHTML = `<span class="speaker">${data.speaker}:</span> ${data.text}` +
        `<span class="conf">(confidence: ${conf})</span>`;
      transcriptEl.appendChild(div);
      transcriptEl.scrollTop = transcriptEl.scrollHeight;
    }

    async function startMic() {
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      sourceNode = audioCtx.createMediaStreamSource(mediaStream);

      processorNode = audioCtx.createScriptProcessor(4096, 1, 1);
      sourceNode.connect(processorNode);
      processorNode.connect(audioCtx.destination);

      let frameCount = 0;
      processorNode.onaudioprocess = (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const input = e.inputBuffer.getChannelData(0);
        const downsampled = downsampleTo16k(input, audioCtx.sampleRate);
        const pcm16 = floatTo16BitPCM(downsampled);
        frameCount++;
        console.log(`Sending frame ${frameCount}: ${pcm16.byteLength} bytes`);
        ws.send(pcm16);
      };

      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
      setStatus(`Streaming mic @ ${audioCtx.sampleRate}Hz -> resampled to ${TARGET_SAMPLE_RATE}Hz`);
    }

    function stopMic() {
      if (processorNode) processorNode.disconnect();
      if (sourceNode) sourceNode.disconnect();
      if (mediaStream) mediaStream.getTracks().forEach((t) => t.stop());
      if (audioCtx) audioCtx.close();
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
      setStatus('Mic stopped.');
    }

    function endSession() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'end_session' }));
      }
    }

    function downsampleTo16k(buffer, inputSampleRate) {
      if (inputSampleRate === TARGET_SAMPLE_RATE) return buffer;
      const ratio = inputSampleRate / TARGET_SAMPLE_RATE;
      const outLength = Math.floor(buffer.length / ratio);
      const result = new Float32Array(outLength);
      for (let i = 0; i < outLength; i++) {
        const srcIndex = i * ratio;
        const i0 = Math.floor(srcIndex);
        const i1 = Math.min(i0 + 1, buffer.length - 1);
        const frac = srcIndex - i0;
        result[i] = buffer[i0] * (1 - frac) + buffer[i1] * frac;
      }
      return result;
    }

    function floatTo16BitPCM(float32Array) {
      const buffer = new ArrayBuffer(float32Array.length * 2);
      const view = new DataView(buffer);
      for (let i = 0; i < float32Array.length; i++) {
        const s = Math.max(-1, Math.min(1, float32Array[i]));
        view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
      return buffer;
    }
  </script>
</body>
</html>
