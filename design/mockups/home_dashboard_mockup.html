<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home / Dashboard — mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #10121B;
    --panel: #1B1E2E;
    --panel-raised: #262B40;
    --hairline: #333850;
    --amber: #E7A83D;
    --amber-dim: #4A3A1E;
    --blue: #6FA3D8;
    --blue-dim: #23344A;
    --paper: #EDE9E2;
    --mist: #8A8FA6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #E7E4DC;
    font-family: 'IBM Plex Sans', sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 16px;
  }
  .frame {
    width: 390px;
    height: 820px;
    background: #05060A;
    border-radius: 46px;
    padding: 14px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.25);
  }
  .screen {
    width: 100%;
    height: 100%;
    background: var(--ink);
    border-radius: 34px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    color: var(--paper);
  }
  .notch {
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .notch::before {
    content: "";
    width: 90px;
    height: 6px;
    background: #000;
    border-radius: 4px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px 18px;
  }
  .wordmark {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--mist);
  }
  .wordmark b { color: var(--paper); font-weight: 500; }
  .gear-btn {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gear-btn svg { width: 16px; height: 16px; stroke: var(--mist); }

  .cta-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 0 30px;
  }
  .cta-ring-wrap {
    position: relative;
    width: 128px;
    height: 128px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cta-btn {
    width: 92px; height: 92px;
    border-radius: 50%;
    background: var(--panel-raised);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    box-shadow: 0 0 0 1px var(--hairline);
  }
  .cta-btn svg { width: 34px; height: 34px; stroke: var(--amber); }
  .ring-tick {
    position: absolute;
    top: 50%; left: 50%;
    width: 3px; height: 10px;
    background: var(--amber-dim);
    border-radius: 2px;
    transform-origin: 1.5px 64px;
  }
  .cta-label {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 16px;
    margin-top: 16px;
  }
  .cta-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--mist);
    margin-top: 4px;
  }

  .section {
    padding: 0 22px;
    flex: 1;
    overflow-y: auto;
  }
  .section-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.3px;
    color: var(--paper);
    margin-bottom: 12px;
  }

  .session-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    border-radius: 12px;
    padding: 13px 14px;
    margin-bottom: 10px;
  }
  .session-left { display: flex; align-items: center; gap: 11px; }
  .session-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--blue);
    flex-shrink: 0;
  }
  .session-dot.none { background: var(--hairline); }
  .session-info-title {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--paper);
  }
  .session-info-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--mist);
    margin-top: 3px;
  }
  .session-chevron svg { width: 14px; height: 14px; stroke: var(--mist); }

  .bottom-hint {
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--mist);
    padding: 14px 0 24px;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="screen">
    <div class="notch"></div>
    <div class="header">
      <div class="wordmark">CO<b>/</b>PILOT</div>
      <div class="gear-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>
      </div>
    </div>

    <div class="cta-section">
      <div class="cta-ring-wrap" id="ctaRing">
        <div class="cta-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>
        </div>
      </div>
      <div class="cta-label">Start Session</div>
      <div class="cta-sub">last used 2 hours ago</div>
    </div>

    <div class="section">
      <div class="section-title">Recent Sessions</div>

      <div class="session-card">
        <div class="session-left">
          <span class="session-dot"></span>
          <div>
            <div class="session-info-title">Backend architecture interview</div>
            <div class="session-info-meta">Aug 13 · 12:04 · 6 suggestions</div>
          </div>
        </div>
        <div class="session-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </div>

      <div class="session-card">
        <div class="session-left">
          <span class="session-dot"></span>
          <div>
            <div class="session-info-title">Client discovery call</div>
            <div class="session-info-meta">Aug 12 · 31:47 · 4 suggestions</div>
          </div>
        </div>
        <div class="session-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </div>

      <div class="session-card">
        <div class="session-left">
          <span class="session-dot none"></span>
          <div>
            <div class="session-info-title">Quick sync — no questions detected</div>
            <div class="session-info-meta">Aug 10 · 04:12</div>
          </div>
        </div>
        <div class="session-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </div>
    </div>

    <div class="bottom-hint">view all sessions</div>
  </div>
</div>

<script>
  const wrap = document.getElementById('ctaRing');
  const tickCount = 20;
  for (let i = 0; i < tickCount; i++) {
    const tick = document.createElement('div');
    tick.className = 'ring-tick';
    const angle = (360 / tickCount) * i;
    tick.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
    wrap.appendChild(tick);
  }
</script>
</body>
</html>
